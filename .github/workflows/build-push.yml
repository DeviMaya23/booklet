name: Build and Push

on:
  push:
    branches:
      - main
    paths:
      - backend/**
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-push:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/258487485284/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-github@bookleaf-393.iam.gserviceaccount.com

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker australia-southeast1-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: australia-southeast1-docker.pkg.dev/bookleaf-393/booklet/backend:latest

  deploy:
    name: Deploy to Cloud Run
    runs-on: ubuntu-latest
    needs: build-push
    steps:
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/258487485284/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: ci-github@bookleaf-393.iam.gserviceaccount.com

      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: booklet-backend
          region: australia-southeast1
          image: australia-southeast1-docker.pkg.dev/bookleaf-393/booklet/backend:latest
          flags: --service-account=ci-github@bookleaf-393.iam.gserviceaccount.com
          secrets: |
            DATABASE_PASSWORD=BOOKLET_DATABASE_PASSWORD:latest
            R2_SECRET_ACCESS_KEY=BOOKLET_R2_SECRET_ACCESS_KEY:latest
            BOOKLEAF_INTERNAL_SECRET=BOOKLEAF_INTERNAL_SECRET:latest
            INTERNAL_API_SECRET=INTERNAL_API_SECRET:latest
          env_vars: |
            DATABASE_HOST=ep-cold-paper-a73043qf.ap-southeast-2.aws.neon.tech
            DATABASE_USER=booklet-owner
            DATABASE_NAME=booklet
            DATABASE_PORT=5432
            DATABASE_SSLMODE=require
            KINDE_ISSUER_URL=https://bookleaf.kinde.com
            KINDE_AUDIENCE=https://booklet-api
            R2_ACCOUNT_ID=4405668e0fb9df82719d43486c50d587
            R2_BUCKET_NAME=booklet-prod
            BOOKLEAF_HOST=https://bookleaf-backend-258487485284.australia-southeast1.run.app
            CORS_ALLOWED_ORIGINS=https://booklet.bookverse.fyi
            R2_ACCESS_KEY_ID={{ vars.R2_ACCESS_KEY_ID }}

